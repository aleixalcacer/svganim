name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest

  # The code leans on matplotlib's SVG backend, so test both ends of the supported
  # range: the oldest version pyproject.toml allows and the newest release.
  matplotlib:
    name: matplotlib (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            args: --resolution lowest-direct
          - name: latest
            args: --upgrade-package matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --python 3.12 ${{ matrix.args }} pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
