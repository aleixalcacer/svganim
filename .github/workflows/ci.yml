name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest

  # The paths and the files are the part that can depend on the system.
  os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --python 3.12 pytest

  # The code leans on matplotlib's SVG backend, so test both ends of the supported
  # range: the oldest version pyproject.toml allows and the newest release.
  matplotlib:
    name: matplotlib (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            args: --resolution lowest-direct
          - name: latest
            args: --upgrade-package matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --python 3.12 ${{ matrix.args }} pytest

  # Renders the animation in Chromium and compares each frame with the plain SVG
  # that matplotlib draws for it.
  browser:
    runs-on: ubuntu-latest
    env:
      SVGANIM_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --group browser
      - run: uv run playwright install --with-deps chromium-headless-shell
      - run: uv run pytest tests/test_browser.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
