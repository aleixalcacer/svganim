[project]
name = "svganim"
version = "0.1.0"
description = "Turn a matplotlib figure and an update function into a single self-contained animated SVG. No GIFs, no JavaScript."
license = "MIT"
license-files = ["LICENSE"]
keywords = ["matplotlib", "svg", "animation", "smil", "data-visualization"]
readme = "README.md"
authors = [
    { name = "Aleix Alcacer Sales", email = "aalcacer@uji.es" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.10.9",
]

[project.urls]
Documentation = "https://svganim.readthedocs.io"
Repository = "https://github.com/aleixalcacer/svganim"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
docs = [
    "furo>=2025.12.19",
    "ipykernel>=7.3.0",
    "myst-nb>=1.4.0",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-design>=0.6.1",
]
